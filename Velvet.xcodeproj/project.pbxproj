			shellScript = "# Kopiert yt-dlp (yt-dlp_macos.zip), ffmpeg, ffprobe und deno aus Binaries/ ins App-Bundle (Contents/Resources/bin).\n# Fehlen sie, werden sie automatisch über Scripts/fetch-binaries.sh heruntergeladen.\nset -euo pipefail\nSRC=\"${PROJECT_DIR}/Binaries\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin\"\nTOOLS=\"ffmpeg ffprobe deno\"\nFILES=\"yt-dlp_macos.zip yt-dlp.version\"\n\nmissing=0\nfor tool in $TOOLS; do\n    [ -x \"$SRC/$tool\" ] || missing=1\ndone\nfor file in $FILES; do\n    [ -f \"$SRC/$file\" ] || missing=1\ndone\n\nif [ \"$missing\" = 1 ]; then\n    echo \"note: Werkzeuge fehlen – lade sie mit Scripts/fetch-binaries.sh herunter …\"\n    if ! \"${PROJECT_DIR}/Scripts/fetch-binaries.sh\"; then\n        echo \"error: Die Werkzeuge konnten nicht geladen werden. Bitte Scripts/fetch-binaries.sh im Terminal ausführen.\"\n        exit 1\n    fi\nfi\n\nmkdir -p \"$DEST\"\nrm -f \"$DEST/yt-dlp\"\nfor tool in $TOOLS; do\n    rsync -a \"$SRC/$tool\" \"$DEST/$tool\"\n    chmod 755 \"$DEST/$tool\"\ndone\nfor file in $FILES; do\n    rsync -a \"$SRC/$file\" \"$DEST/$file\"\ndone\n";
